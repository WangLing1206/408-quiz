/* 启动层关键样式内联，避免 WebView 首帧白屏 */
html, body { margin: 0; background: #ffffff; }
body.launching { overflow: hidden; }
#launch {
  position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 20px; padding: 24px;
  background: #ffffff;
  color: #1a2130; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  transition: opacity .5s ease, visibility .5s ease;
}
.launch-card {
  width: min(72vw, 300px); aspect-ratio: 1 / 1; border-radius: 32px; overflow: hidden;
  background: #ffffff; padding: 10px; box-sizing: border-box;
  border: 1px solid #ffffff; box-shadow: 0 18px 50px rgba(33, 41, 80, .16), 0 0 0 1px #eef0f6;
}
.launch-video { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 23px; background: #c9bfbe; }
.launch-title { text-align: center; font-size: 23px; font-weight: 800; letter-spacing: .5px; color: #1a2130; }
.launch-title span { display: block; margin-top: 5px; font-size: 11px; font-weight: 500; letter-spacing: 2.5px; color: #7a8296; }
.launch-bar { width: 112px; height: 3px; background: #e9ecf4; border-radius: 99px; overflow: hidden; }
.launch-bar i { display: block; height: 100%; width: 0; background: #4f46e5; border-radius: 99px; animation: launchbar 2.1s ease forwards; }
@keyframes launchbar { to { width: 100%; } }
.launch-out { opacity: 0; visibility: hidden; pointer-events: none; }
</style>
